<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation Canvas · 独立画布</title>
<style>body{margin:0;font:14px system-ui;background:#f8fafc;color:#182230}header{height:60px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #ddd;background:white}header strong{white-space:nowrap}select{max-width:55vw;padding:7px;border:1px solid #ccd3db;border-radius:7px}button{cursor:pointer;padding:7px;border:1px solid #ccd3db;background:white;border-radius:7px}.ms-auto{margin-left:auto;display:flex;align-items:center;gap:6px}main{padding:28px;max-width:800px;margin:auto}#notice{white-space:pre-wrap;color:#526073}a{color:#2563eb}</style>
<header data-testid="app-shell-header-context-menu-surface"><strong>对话脉络</strong><select id="threads" aria-label="选择对话"><option value="">正在读取本机对话…</option></select><button id="more">更多</button><button id="refresh">刷新列表</button><div class="ms-auto" data-app-shell-header-obstacle="true"></div></header>
<main><h1>独立任务画布</h1><p>选择对话后打开右上角分支图标。通过「整理设置」填写第三方 API，点击「整理脉络」生成任务树。</p><p>对话原文、任务树与进度保存在本机。只有点击测试连接或整理时才请求你配置的模型服务。关闭 Codex 后也可读取本机已经保存的对话。</p><p>本机没有保存的远程／云端对话暂不支持；界面不会用空结果冒充完整历史。</p><p id="notice" role="status"></p></main>
<script src="/app.js"></script><script src="/canvas.js"></script></html>
